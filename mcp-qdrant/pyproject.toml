[project]
name = "qdrant-knowledge-mcp"
version = "0.1.0"
description = "Qdrant 向量库 MCP Server — 将 Qdrant+Ollama(bge-m3) 打包给 opencode local MCP 使用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zenix" }]
keywords = ["mcp", "qdrant", "ollama", "opencode", "vector", "embedding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "mcp>=1.27.1",
  "qdrant-client>=1.19.0",
  "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/peng-zhihui/Dummy-Robot"

[project.scripts]
qdrant-knowledge-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
